[[entries]]
kind = "sandbox-process"
action = "allow"
op = "process-info-codesignature"
target = "any"

[[entries]]
kind = "modified"

[entries.modifiers]
slot = "after-ops"
with = ["(with no-sandbox)"]

[entries.entry]
kind = "sandbox-exec"
action = "allow"
op = "process-exec"

[entries.entry.path]
form = "literal"
suffix = "/bin/ps"

[entries.entry.path.base]
kind = "absolute"
