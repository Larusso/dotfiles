[[entries]]
kind = "sandbox-process"
action = "allow"
op = "process-info-pidinfo"
target = "any"

[[entries]]
kind = "sandbox-process"
action = "allow"
op = "process-info-listpids"
target = "any"

[[entries]]
kind = "sandbox-process"
action = "allow"
op = "process-info-pidfdinfo"
target = "any"

[[entries]]
kind = "sandbox-process"
action = "allow"
op = "process-info-pidfileportinfo"
target = "any"

[[entries]]
kind = "sandbox-process"
action = "allow"
op = "process-info-rusage"
target = "any"

[[entries]]
kind = "sandbox-process"
action = "allow"
op = "process-info-ledger"
