version = 1
env_patterns = ["HC_*"]

[[entries]]
kind = "define"
name = "clortho_env_herdr_xdg_config_home"

[entries.value]
kind = "env"
var = "XDG_CONFIG_HOME"
fallback_default = "__CLORTHO_HOME__/.config"

[[entries]]
kind = "sandbox-file"
action = "allow"
op = "file-read-data"
comment = "Herdr application modification configs"

[entries.path]
form = "subpath"
suffix = "/herdr-app"

[entries.path.base]
kind = "define-ref"
name = "clortho_env_herdr_xdg_config_home"

[[entries]]
kind = "sandbox-file"
action = "allow"
op = "file-read-metadata"
comment = "Herdr application modification configs"

[entries.path]
form = "subpath"
suffix = "/herdr-app"

[entries.path.base]
kind = "define-ref"
name = "clortho_env_herdr_xdg_config_home"

