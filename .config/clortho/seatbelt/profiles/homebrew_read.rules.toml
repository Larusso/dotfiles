sbpl = "(allow file-read* (apply require-any (path-literals homebrew_cache_dir)) (apply require-any (path-literals homebrew_prefix)) (apply require-any (path-literals homebrew_cellar)) (apply require-any (path-literals homebrew_repository)))"
