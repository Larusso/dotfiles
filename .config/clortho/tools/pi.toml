command = "pi"
args = []

[backend]
type = "seatbelt"
sub_profiles = [
    "proc",
    "sys-libs",
    "sys-private",
    "user-prefs",
    "tmp-write",
    "devices",
    "mach-core",
    "network-outbound",
    "processes",
    "nix-read",
]
# Passed into the seatbelt. The profile already uses this name for file rules;
# without it here, Pi falls back to ~/.pi/agent and never loads extensions/.
extra_env = ["PI_CODING_AGENT_DIR"]

